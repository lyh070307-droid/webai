<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스타일시트 이해하기</title>
  <style>
    h1 {
      font-size: 28px;
    }
    h1::before {
      content: "◆ ";
      color: blue;
    }
    .copyright {
      font-size: 20px;
      font-weight: normal;
    }
    strong {
      font-weight: bold;
    }
    a {
      color: blue;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>스타일시트 이해하기 <span class="copyright">(©sblim)</span></h1>
  
  <p>이 예제는 <strong>CSS</strong>의 개념을 설명합니다.</p>
  
  <p>선택자에 <a href="#">가상클래스</a>와 <a href="#">선택자 조합</a>을 적용하여 스타일을 지정합니다.</p>
</body>
</html>
