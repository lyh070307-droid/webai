<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style type="text/css">
            ol li {list-style-type: lower-alpha;}
            ol {list-style-position: inside;}
            ul {list-style-position: outside;}
            li.kor {list-style-type: square;}
            li.usa {list-style-type: circle;}
            li.usa {list-style-image: url(.gif);}
            #book {width: 90%; min-width: 600px; border-spacing: 8px;}
            p {background-color: aqua;}
            p:hover{background-color: yellow; transition: background-color: aqua;}
            ul {background-color:  brown;}
            li {background-color: blue;}
            td {background-color: chartreuse;}
        </style>
        <body>
            <p>순서가 없는 목록</p>
            <ul>
                <li>첫 번째</li>
                <li>두 번째</li>
                <li>세 번째</li>
            </ul>
            <p>순서가 있는 목록</p>
             <ol>
                <li class="usa">첫 번째</li>
                <li class="kor">두 번째</li>
                <li class="usa">세 번째</li>
            </ol>  
            <table border="1" id="book">
                <tr>
                    <th>과목</th>
                    <th>책제목</th>
                    <th>저자</th>
                    <th>출판사</th>
                </tr>
                <tr>
                    <td rowspan="2">웹프로그래밍</td>
                    <td>HTML5</td>
                    <td>인순범</td>
                    <td>생능</td>
                </tr>
                <tr>
                    <td>소셜미디어</td>
                    <td>최윤철</td>
                    <td>생능</td>
                </tr>
                <tr>
                    <th>합계</th>
                    <td colspan="3">3권</td>
                </tr>
            </table>         
        </body>
    </head>
</html>
